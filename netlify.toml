# Static wedding invitation site
[build]
  # A build step helps Netlify run form detection reliably
  command = "echo 'Static wedding site — Netlify Forms enabled'"
  publish = "."

# Forms: data-netlify="true" on form name="rsvp" in index.html
# Dashboard → Forms → rsvp

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
