# Static wedding invitation site
[build]
  publish = "."
  # No build command — pure HTML/CSS/JS

# Netlify Forms are enabled automatically when forms use data-netlify="true"
# Submissions: Site → Forms → rsvp

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
